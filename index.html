<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tuna Tuna — Guitar Tuner</title>
<meta name="description" content="Tuna Tuna: a fast, precise guitar tuner that works offline. Standard tuning, auto string detection, adjustable A4.">
<meta name="theme-color" content="#0b0d10">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/maskable.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tuna Tuna">
<link rel="stylesheet" href="styles.css">
</head><body>
<main>
  <header>
    <div class="brand"><img src="icons/icon.svg" alt="" width="34" height="34"><h1>Tuna Tuna</h1></div>
    <details class="settings">
      <summary id="a4-pill" aria-label="Reference pitch settings">A4 440 Hz</summary>
      <div class="panel">
        <label for="a4">Reference pitch (A4): <strong><span id="a4-val">440</span> Hz</strong></label>
        <div class="stepper">
          <button type="button" id="a4-down" aria-label="Lower reference by 1 hertz">−</button>
          <input id="a4" type="range" min="432" max="446" step="1" value="440">
          <button type="button" id="a4-up" aria-label="Raise reference by 1 hertz">+</button>
        </div>
        <button type="button" id="a4-reset" class="link">Reset to 440 Hz</button>
      </div>
    </details>
  </header>

  <section class="card meter" aria-label="Tuning meter">
    <svg viewBox="0 0 500 290" role="img" aria-labelledby="meter-title">
      <title id="meter-title">Needle gauge from 50 cents flat to 50 cents sharp</title>
      <defs>
        <linearGradient id="steel" x1="0" x2="1"><stop offset="0" stop-color="#9aa0aa"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa0aa"/></linearGradient>
        <radialGradient id="hub"><stop offset="0" stop-color="#f4f5f2"/><stop offset="1" stop-color="#5e626b"/></radialGradient>
        <radialGradient id="glow" cx=".5" cy="1" r=".7"><stop offset="0" stop-color="#8fd0a0" stop-opacity=".35"/><stop offset="1" stop-color="#8fd0a0" stop-opacity="0"/></radialGradient>
      </defs>
      <rect class="glow" x="0" y="0" width="500" height="290" fill="url(#glow)"/>
      <g id="band"></g>
      <g id="ticks"></g>
      <text x="92" y="276" class="flat-sharp">♭ flat</text>
      <text x="408" y="276" class="flat-sharp">sharp ♯</text>
      <g id="needle"><polygon points="246.5,262 253.5,262 250.6,44 249.4,44" fill="url(#steel)"/><circle cx="250" cy="44" r="3.2" class="needle-tip"/></g>
      <circle cx="250" cy="250" r="13" fill="url(#hub)"/><circle cx="250" cy="250" r="3.5" fill="#0b0d10"/>
    </svg>
    <div class="readout">
      <div id="note" class="note" aria-hidden="true">&ndash;</div>
      <div id="dir" class="dir">Tap start, then pluck a string</div>
      <div class="nums"><span id="cents">— ¢</span><span class="dot">·</span><span id="hz">— Hz</span></div>
    </div>
  </section>

  <section class="strings-wrap" aria-label="String selection">
    <div class="row-head">
      <span>Standard E</span>
      <button type="button" id="auto" class="mode-toggle" aria-pressed="true">Auto-detect</button>
    </div>
    <div id="strings" class="strings" role="group" aria-label="Guitar strings"></div>
  </section>

  <button id="start" class="primary" type="button">Start tuner</button>
  <button id="install" class="ghost" type="button" hidden>Install app</button>
  <p class="hint">Green = in tune, within ±3 cents. Pluck all six strings in a row to celebrate.</p>
  <p id="status" class="status" role="status"></p>
  <p id="sr" class="sr-only" aria-live="polite"></p>
</main>
<div id="celebrate" class="celebrate" aria-live="polite">
  <div id="splatters" class="splatters" aria-hidden="true"></div>
  <div class="celebrate-copy">
    <div class="celebrate-text">All six strings in tune!</div>
    <div id="celebrate-sub" class="celebrate-sub"></div>
  </div>
</div>
<script src="app.js"></script>
</body></html>
